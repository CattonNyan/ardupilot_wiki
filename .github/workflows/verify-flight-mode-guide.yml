name: Verify Copter flight mode guide
on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Optional run ID containing the unchanged compiled examples'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  documentation:
    if: inputs.reuse_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install documentation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run repository checks on the changed page
        run: pre-commit run --files dev/source/docs/apmcopter-adding-a-new-flight-mode.rst
      - name: Build the developer Wiki
        run: |
          python update.py --site dev --parallel 2 2>&1 | tee wiki-build.log
      - name: Check and capture the rendered page
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          target = Path('dev/build/html/docs/apmcopter-adding-a-new-flight-mode.html').resolve()
          assert target.exists(), target
          warnings = [line for line in Path('wiki-build.log').read_text().splitlines()
                      if 'apmcopter-adding-a-new-flight-mode.rst' in line and ('WARNING:' in line or 'ERROR:' in line)]
          assert not warnings, '\n'.join(warnings)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              page.goto(target.as_uri())
              page.screenshot(path='flight-mode-guide.png', full_page=True)
              for name, text in [('class', 'Number mode_number()'), ('run', 'get_pilot_desired_lean_angles_rad'),
                                 ('instances', 'ModeNewMode mode_newmode;'), ('lookup', 'return &mode_newmode;'),
                                 ('available', '&copter.mode_newmode,'), ('parameters', '99:NewMode'),
                                 ('enum', 'NEW_MODE =     99'), ('blocking', '(uint8_t)Mode::Number::TURTLE,')]:
                  block = page.locator('div.highlight').filter(has_text=text).first
                  assert block.count(), text
                  block.screenshot(path=f'flight-mode-{name}.png')
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-mode-documentation
          path: |
            dev/build/html
            wiki-build.log
            flight-mode-*.png
          retention-days: 7
  examples:
    if: inputs.reuse_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ArduPilot/ardupilot
          ref: cafe67457776027a1bad6e165c409828c1a851e5
          path: firmware
          submodules: recursive
      - name: Install SITL prerequisites in the GitHub runner
        env:
          SKIP_AP_GRAPHIC_ENV: '1'
          SKIP_AP_EXT_ENV: '1'
          SKIP_AP_COV_ENV: '1'
          SKIP_AP_GIT_CHECK: '1'
        run: |
          firmware/Tools/environment_install/install-prereqs-ubuntu.sh -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Insert examples extracted from the modified documentation
        run: |
          python3 .github/verification/flight_mode_guide.py prepare firmware --guide dev/source/docs/apmcopter-adding-a-new-flight-mode.rst
          git -C firmware diff > example-verification.patch
          cp firmware/ArduCopter/mode_newmode.cpp example-mode.cpp
      - name: Compile the documentation examples in Copter SITL
        working-directory: firmware
        run: |
          ./waf configure --board sitl
          ./waf copter -j2 2>&1 | tee ../example-build.log
      - name: Check mode discovery, GCS blocking and entry without arming
        run: python3 -u .github/verification/flight_mode_guide.py smoke firmware 2>&1 | tee smoke-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-mode-examples
          path: |
            example-verification.patch
            example-mode.cpp
            example-metadata.json
            example-build.log
            smoke-results.log
            sitl-smoke.log
            firmware/build/sitl/bin/arducopter
          retention-days: 7
  retest:
    if: inputs.reuse_run != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Verify the compiled run used the same guide and preparation code
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILED_RUN: ${{ inputs.reuse_run }}
        run: |
          COMPILED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILED_RUN" --jq .head_sha)
          git fetch --depth 1 origin "$COMPILED_SHA"
          git diff --exit-code FETCH_HEAD HEAD -- dev/source/docs/apmcopter-adding-a-new-flight-mode.rst
          python - <<'PY'
          from pathlib import Path
          import subprocess
          old = subprocess.check_output(['git', 'show', 'FETCH_HEAD:.github/verification/flight_mode_guide.py'], text=True)
          current = Path('.github/verification/flight_mode_guide.py').read_text()
          assert old.split('\ndef smoke(')[0] == current.split('\ndef smoke(')[0], 'Preparation changed: rebuild required'
          print('PASS: guide and preparation code match the compiled artifact source')
          PY
      - uses: actions/checkout@v7
        with:
          repository: ArduPilot/ardupilot
          ref: cafe67457776027a1bad6e165c409828c1a851e5
          path: firmware
      - name: Install MAVLink parsing dependencies and pinned definitions
        run: |
          python -m pip install pymavlink
          git -C firmware submodule update --init modules/mavlink
      - uses: actions/download-artifact@v4
        with:
          name: flight-mode-examples
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
          path: compiled
      - name: Restore unchanged compiled examples
        run: |
          mkdir -p firmware/build/sitl/bin
          cp compiled/firmware/build/sitl/bin/arducopter firmware/build/sitl/bin/arducopter
          chmod +x firmware/build/sitl/bin/arducopter
          cp compiled/example-metadata.json .
          sha256sum firmware/build/sitl/bin/arducopter | tee compiled-binary.sha256
      - name: Check mode discovery, GCS blocking and entry without arming
        run: python -u .github/verification/flight_mode_guide.py smoke firmware 2>&1 | tee smoke-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-mode-smoke-retest
          path: |
            smoke-results.log
            sitl-smoke.log
            compiled-binary.sha256
            example-metadata.json
          retention-days: 7
